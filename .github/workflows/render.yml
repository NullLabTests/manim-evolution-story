name: Render Videos

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      resolution:
        description: 'Render quality'
        required: true
        default: 'l'
        type: choice
        options:
          - l (480p15)
          - h (1080p60)
      scene:
        description: 'Scene to render'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - master
          - TitleScene
          - BigBangScene
          - StarFormationScene
          - SolarSystemScene
          - OriginOfLifeScene
          - GreatOxidationScene
          - EukaryotesScene
          - CambrianExplosionScene
          - SeaToLandScene
          - RiseOfMammalsScene
          - PrimateLineageScene
          - HumanEvolutionScene
          - ConclusionScene

env:
  SCENE: ${{ github.event.inputs.scene || 'all' }}
  QUALITY: ${{ github.event.inputs.resolution || 'h' }}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Render master video
        if: env.SCENE == 'master' || env.SCENE == 'all'
        run: manim -pq${{ env.QUALITY }} scripts/full_video.py FullStoryScene

      - name: Render individual scenes
        if: env.SCENE == 'all'
        run: |
          for scene in TitleScene BigBangScene StarFormationScene SolarSystemScene \
                       OriginOfLifeScene GreatOxidationScene EukaryotesScene \
                       CambrianExplosionScene SeaToLandScene RiseOfMammalsScene \
                       PrimateLineageScene HumanEvolutionScene ConclusionScene; do
            manim -pq${{ env.QUALITY }} scripts/create_longform_video.py $scene
          done

      - name: Render single scene
        if: env.SCENE != 'master' && env.SCENE != 'all'
        run: manim -pq${{ env.QUALITY }} scripts/create_longform_video.py ${{ env.SCENE }}

      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos-${{ env.SCENE }}-${{ env.QUALITY }}
          path: media/videos/
          compression-level: 0
          retention-days: 30
