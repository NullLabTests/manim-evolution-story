name: Render Videos

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      resolution:
        description: 'Render quality'
        required: true
        default: 'l'
        type: choice
        options:
          - l (480p15)
          - h (1080p60)
      scene:
        description: 'Scene to render'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - master
          - TitleScene
          - BigBangScene
          - StarFormationScene
          - SolarSystemScene
          - OriginOfLifeScene
          - GreatOxidationScene
          - EukaryotesScene
          - CambrianExplosionScene
          - SeaToLandScene
          - RiseOfMammalsScene
          - PrimateLineageScene
          - HumanEvolutionScene
          - ConclusionScene

env:
  SCENE: ${{ github.event.inputs.scene || 'all' }}
  QUALITY: ${{ github.event.inputs.resolution || 'h' }}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Render master video
        if: env.SCENE == 'master' || env.SCENE == 'all'
        run: manim -pq${{ env.QUALITY }} scripts/full_video.py FullStoryScene

      - name: Render individual scenes
        if: env.SCENE == 'all'
        run: |
          for scene in TitleScene BigBangScene StarFormationScene SolarSystemScene \
                       OriginOfLifeScene GreatOxidationScene EukaryotesScene \
                       CambrianExplosionScene SeaToLandScene RiseOfMammalsScene \
                       PrimateLineageScene HumanEvolutionScene ConclusionScene; do
            manim -pq${{ env.QUALITY }} scripts/create_longform_video.py $scene
          done

      - name: Render single scene
        if: env.SCENE != 'master' && env.SCENE != 'all'
        run: manim -pq${{ env.QUALITY }} scripts/create_longform_video.py ${{ env.SCENE }}

      - name: Determine output directory
        id: dirs
        run: |
          if [ "${{ env.QUALITY }}" = "h" ]; then DIR="1080p60"; else DIR="480p15"; fi
          echo "quality_dir=$DIR" >> $GITHUB_OUTPUT

      - name: Concatenate scenes into master
        if: env.SCENE == 'all' || env.SCENE == 'master'
        run: |
          SCENES="TitleScene BigBangScene StarFormationScene SolarSystemScene OriginOfLifeScene GreatOxidationScene EukaryotesScene CambrianExplosionScene SeaToLandScene RiseOfMammalsScene PrimateLineageScene HumanEvolutionScene ConclusionScene"
          printf "file '$PWD/media/videos/create_longform_video/${{ steps.dirs.outputs.quality_dir }}/%s.mp4'\n" $SCENES > /tmp/scenes.txt
          ffmpeg -f concat -safe 0 -i /tmp/scenes.txt -c copy media/master/FullEvolutionStory.mp4 -y

      - name: Generate ambient audio
        if: env.SCENE == 'all' || env.SCENE == 'master'
        run: |
          ffmpeg -f lavfi -i "anoisesrc=d=245:c=pink:a=0.5" \
            -f lavfi -i "sine=frequency=55:duration=245" \
            -f lavfi -i "sine=frequency=110:duration=245" \
            -f lavfi -i "sine=frequency=165:duration=245" \
            -filter_complex "[1]volume=0.15[a];[2]volume=0.10[b];[3]volume=0.08[c];[0]volume=0.3[n];[a][b][c][n]amix=inputs=4:duration=first:weights=2 1.5 1 0.5,afade=t=in:ss=0:d=3,afade=t=out:st=240:d=5" \
            -ac 2 /tmp/ambient.wav -y
          ffmpeg -i media/master/FullEvolutionStory.mp4 -i /tmp/ambient.wav \
            -c:v copy -c:a aac -map 0:v:0 -map 1:a:0 -shortest \
            media/master/FullEvolutionStory_WithSound.mp4 -y

      - name: Package release archive
        if: env.SCENE == 'all' && startsWith(github.ref, 'refs/tags/')
        run: |
          zip -j /tmp/release.zip ${{ github.workspace }}/media/master/*.mp4 2>/dev/null || true
          zip -j /tmp/release.zip ${{ github.workspace }}/media/scenes/BigBangScene_4K_Cinematic.mp4 2>/dev/null || true
          ls -lh /tmp/release.zip

      - name: Create Release
        if: env.SCENE == 'all' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release.zip
          generate_release_notes: true
          make_latest: true

      - name: Upload rendered videos (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos-${{ env.SCENE }}-${{ env.QUALITY }}
          path: |
            media/videos/
            media/master/
            media/scenes/
          compression-level: 0
          retention-days: 30
